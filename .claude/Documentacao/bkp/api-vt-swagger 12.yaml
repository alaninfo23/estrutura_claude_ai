openapi: 3.0.3
info:
  title: API Vale Transporte - Alelo
  description: 'API para cadastro de colaboradores e realização de pedidos de Vale Transporte.

    Baseada no Layout de Pedidos Alelo VT V8.00 (01/07/2026).


    ## Autenticação e Autorização


    A autenticação é gerenciada pelo API Gateway (Sensedia) via **clientId/clientSecret** (OAuth2 Client Credentials).


    **Fluxo de autorização:**

    1. Consumer se autentica no Sensedia com `clientId` + `clientSecret`

    2. Sensedia valida as credenciais e extrai a **raiz do CNPJ** vinculada ao `clientId`

    3. Sensedia injeta a raiz do CNPJ no header `X-Company-Document-Root` e encaminha ao backend

    4. Sensedia chama `POST /authorize` para verificar se a empresa pertence ao grupo do clientId

    5. Se não pertencer → retorna 401 (Unauthorized) e não encaminha a requisição


    **Headers injetados pelo Sensedia:**

    - `X-Company-Document-Root` — Raiz do CNPJ (8 primeiros dígitos) vinculada ao clientId

    '
  version: 1.0.0
  contact:
    name: Equipe VT
    email: vt@alelo.com.br
servers:
- url: https://api.alelo.com.br/vt/v1
  description: Produção
- url: https://api-hml.alelo.com.br/vt/v1
  description: Homologação
tags:
- name: Autorização
  description: Verificação de permissão de acesso do clientId ao recurso da empresa
- name: Empresas
  description: Gerenciamento de empresas, locais de entrega (places) e interlocutores (responsibles)
- name: Produtos
  description: Catálogo de produtos (benefícios/linhas de transporte) disponíveis para comercialização
- name: Colaboradores
  description: Cadastro e gerenciamento de colaboradores (beneficiários)
- name: Pedidos
  description: Criação e acompanhamento de pedidos de VT
- name: Validações
  description: Consulta de regras de validação aplicáveis ao pedido
- name: Relatórios
  description: Geração e download assíncrono de relatórios de pedidos
paths:
  /authorize:
    post:
      tags:
      - Autorização
      summary: Verificar se o clientId tem permissão para operar na empresa
      description: "Verifica se a raiz do CNPJ vinculada ao `clientId` (header `X-Company-Document-Root`, \ninjetado pelo\
        \ Sensedia) pertence ao mesmo grupo de relacionamento da empresa informada.\n\nEste endpoint deve ser chamado pelo\
        \ API Gateway (Sensedia) **antes** de encaminhar \nqualquer requisição aos demais endpoints da API. Funciona como\
        \ um interceptor de \nautorização para garantir que o consumer só acesse empresas do seu grupo.\n\n## Fluxo no Sensedia\n\
        \n```\n1. Consumer chama qualquer endpoint (ex: GET /companies/{companyId}/orders)\n2. Sensedia extrai X-Company-Document-Root\
        \ do clientId\n3. Sensedia chama POST /authorize com o header + companyId ou companyDocumentNumber\n4a. Se 204 → Sensedia\
        \ encaminha a requisição ao endpoint original\n4b. Se 401 → Sensedia retorna 401 ao consumer (não encaminha)\n```\n\
        \n## Lógica de Verificação\n\nO backend verifica se a raiz do CNPJ (`X-Company-Document-Root`) e a empresa informada\
        \ \n(`companyDocumentNumber` ou `companyId`) pertencem ao mesmo **grupo de relacionamento**.\n\nUm grupo de relacionamento\
        \ é composto por:\n- A empresa matriz (raiz do CNPJ)\n- Todas as filiais vinculadas à mesma raiz\n\n## Parâmetros\
        \ de Entrada (ao menos um obrigatório)\n\n| Parâmetro | Quando usar |\n|-----------|-------------|\n| `companyId`\
        \ | Quando o endpoint original possui `{companyId}` no path |\n| `companyDocumentNumber` | Quando o endpoint original\
        \ recebe CNPJ no body (ex: POST /companies) |\n\nSe ambos forem informados, a validação é feita para ambos (devem\
        \ pertencer ao grupo).\n\n## Comportamentos\n\n| Cenário | HTTP | Descrição |\n|---------|------|-----------|\n| Empresa\
        \ pertence ao grupo do clientId | 204 | Autorizado — seguir com a requisição |\n| Empresa NÃO pertence ao grupo do\
        \ clientId | 401 | Não autorizado — bloquear requisição |\n| Header `X-Company-Document-Root` ausente | 400 | Header\
        \ obrigatório não informado |\n| Nenhum identificador de empresa informado | 400 | Informar `companyId` ou `companyDocumentNumber`\
        \ |\n| `companyId` não encontrado na base | 404 | Empresa não existe |\n| `companyDocumentNumber` não encontrado na\
        \ base | 404 | CNPJ não cadastrado |\n"
      operationId: authorizeAccess
      parameters:
      - name: X-Company-Document-Root
        in: header
        required: true
        description: 'Raiz do CNPJ (8 primeiros dígitos) vinculada ao clientId no Sensedia.

          Injetado automaticamente pelo API Gateway.

          '
        schema:
          type: string
          pattern: ^\d{8}$
          example: '12345678'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                companyId:
                  type: integer
                  format: int64
                  description: 'ID da empresa que o consumer deseja acessar.

                    Extraído do path `{companyId}` do endpoint original.

                    '
                  example: 12345
                companyDocumentNumber:
                  type: string
                  maxLength: 14
                  description: "CNPJ/CPF da empresa que o consumer deseja acessar.\nAceita formato alfanumérico (novo padrão\
                    \ CNPJ brasileiro 2026+) \nou numérico legado (14 dígitos).\nExtraído do body do endpoint original (ex:\
                    \ POST /companies).\n"
                  example: '12345678000199'
              description: 'Ao menos um dos campos (`companyId` ou `companyDocumentNumber`) deve ser informado.

                Se ambos forem informados, ambos são validados.

                '
      responses:
        '204':
          description: "**Autorizado.** A empresa informada pertence ao grupo de relacionamento \ndo clientId. O Sensedia\
            \ pode encaminhar a requisição ao endpoint original.\n"
        '400':
          description: 'Requisição inválida — possíveis causas:

            - Header `X-Company-Document-Root` ausente ou com formato inválido

            - Nenhum identificador de empresa informado (body vazio ou sem `companyId`/`companyDocumentNumber`)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: "**Não autorizado.** A empresa informada NÃO pertence ao grupo de relacionamento \ndo clientId. O Sensedia\
            \ deve retornar 401 ao consumer e NÃO encaminhar a requisição.\n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time
                  status:
                    type: integer
                    example: 401
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Empresa 12345 não pertence ao grupo de relacionamento do clientId
                  companyDocumentRoot:
                    type: string
                    description: Raiz do CNPJ do clientId (para debug)
                    example: '12345678'
                  companyId:
                    type: integer
                    format: int64
                    description: ID da empresa que foi verificada
                    example: 99999
        '404':
          description: Empresa não encontrada (companyId ou companyDocumentNumber não existe na base)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /companies:
    post:
      tags:
      - Empresas
      summary: Consultar empresa por CNPJ
      description: "Retorna os dados da empresa a partir do CNPJ informado.\n\n## CNPJ Alfanumérico\n\nA partir de 2026, o\
        \ CNPJ brasileiro pode conter caracteres alfanuméricos. \nO campo `companyDocumentNumber` aceita tanto o formato numérico\
        \ legado (14 dígitos) \nquanto o novo formato alfanumérico (ex: `NU0BTITKFKG501`).\n\n## Comportamento por tipo de\
        \ empresa\n\n- **Matriz**: retorna os dados da própria empresa + lista de filiais do grupo econômico\n- **Filial**:\
        \ retorna apenas os dados da própria empresa (sem filiais)\n\n## Dados retornados\n\nInclui informações cadastrais\
        \ completas da empresa:\n- Razão social, nome fantasia\n- Inscrição Estadual e Municipal\n- Ramo de atividade\n- Número\
        \ do contrato\n- Meio de pagamento (pré-pago/pós-pago)\n- Filiais (quando matriz)\n"
      operationId: searchCompany
      parameters:
      - name: action
        in: query
        required: true
        schema:
          type: string
          enum:
          - SEARCH
        description: Ação a ser executada (SEARCH para consulta)
      - name: page
        in: query
        required: false
        description: Número da página (inicia em 0)
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        description: Quantidade de registros por página
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - companyDocumentNumber
              properties:
                companyDocumentNumber:
                  type: string
                  maxLength: 14
                  description: 'CNPJ da empresa (alfanumérico ou numérico legado).


                    Exemplos válidos:

                    - `"12345678000199"` — formato numérico legado

                    - `"NU0BTITKFKG501"` — formato alfanumérico novo

                    '
                  example: '61190096000192'
      responses:
        '200':
          description: Lista paginada de empresas encontradas. Quando o CNPJ for de uma matriz, retorna a matriz e suas filiais.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPaginated'
        '404':
          description: Empresa não encontrada para o CNPJ informado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /companies/{companyId}/places:
    get:
      tags:
      - Empresas
      summary: Listar endereços da empresa
      description: 'Retorna os endereços cadastrados na empresa (cobrança, entrega, faturamento e/ou entrega).


        Tipos de endereço:

        - **Cobrança** — Endereço para envio de cobranças/boletos

        - **Entrega** — Endereço para entrega de cartões/vales

        - **Faturamento e/ou Entrega** — Endereço que acumula ambas as funções


        Suporta filtros por tipo, cidade, estado, CEP e busca textual.

        Os resultados são paginados e ordenáveis.

        '
      operationId: listAddresses
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      - name: type
        in: query
        required: false
        description: 'Filtrar por tipo de endereço:

          - `BILLING` — Cobrança

          - `DELIVERY` — Entrega

          - `BILLING_AND_DELIVERY` — Faturamento e/ou Entrega

          Se não informado, retorna todos os tipos.

          '
        schema:
          type: string
          enum:
          - BILLING
          - DELIVERY
          - BILLING_AND_DELIVERY
      - name: city
        in: query
        required: false
        description: Filtrar por cidade (case-insensitive, busca parcial)
        schema:
          type: string
          example: São Paulo
      - name: state
        in: query
        required: false
        description: Filtrar por UF (sigla de 2 caracteres)
        schema:
          type: string
          minLength: 2
          maxLength: 2
          example: SP
      - name: zipCode
        in: query
        required: false
        description: Filtrar por CEP exato (8 dígitos, apenas números)
        schema:
          type: string
          pattern: ^\d{8}$
          example: '01310100'
      - name: neighborhood
        in: query
        required: false
        description: Filtrar por bairro (case-insensitive, busca parcial)
        schema:
          type: string
      - name: search
        in: query
        required: false
        description: 'Busca textual livre (case-insensitive, busca parcial) nos campos:

          logradouro, bairro, cidade, local de referência e nome dos responsáveis pelo recebimento.

          '
        schema:
          type: string
          example: Paulista
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
        description: Número da página (inicia em 0)
      - name: size
        in: query
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
        description: Quantidade de registros por página
      - name: sort
        in: query
        required: false
        description: 'Campo de ordenação. Valores aceitos: `id`, `type`, `city`, `state`, `neighborhood`, `zipCode`.

          Sufixo `,asc` ou `,desc` para direção (default: `id,asc`).

          '
        schema:
          type: string
          default: id,asc
          example: city,asc
      responses:
        '200':
          description: "Lista paginada de endereços. Retorna lista vazia (`content: []`) \nse a empresa não possui endereços\
            \ cadastrados.\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressPaginated'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags:
      - Empresas
      summary: Cadastrar endereço da empresa
      description: 'Cadastra um novo endereço para a empresa (cobrança, entrega ou faturamento/entrega).


        O tipo do endereço é obrigatório e define a finalidade:

        - `BILLING` — Cobrança (boletos, faturas)

        - `DELIVERY` — Entrega (cartões/vales)

        - `BILLING_AND_DELIVERY` — Faturamento e entrega combinados


        Para endereços de entrega, é recomendado incluir:

        - Local de referência (facilita a localização pelo entregador)

        - Até 3 responsáveis pelo recebimento (nome + telefone + ramal)

        '
      operationId: createAddress
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '201':
          description: Endereço cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /companies/{companyId}/responsibles:
    get:
      tags:
      - Empresas
      summary: Listar contatos responsáveis da empresa
      description: "Retorna os contatos cadastrados para a empresa.\nUse este endpoint para obter o `id` do contato responsável\
        \ ao criar um pedido \n(campo `responsibleContactId` no `POST /companies/{companyId}/orders`).\n\nOs resultados podem\
        \ ser filtrados por nome, CPF, email, departamento ou cargo.\n"
      operationId: listContacts
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      - name: name
        in: query
        required: false
        description: Filtrar por nome do contato (case-insensitive, busca parcial)
        schema:
          type: string
          example: Maria
      - name: documentNumber
        in: query
        required: false
        description: Filtrar por CPF do contato (apenas números, 11 dígitos)
        schema:
          type: string
          pattern: ^\d{11}$
          example: '42569190071'
      - name: email
        in: query
        required: false
        description: Filtrar por email do contato (case-insensitive, busca parcial)
        schema:
          type: string
          example: teste@gmail.com
      - name: department
        in: query
        required: false
        description: Filtrar por departamento (case-insensitive, busca parcial)
        schema:
          type: string
          example: FINANCEIRO
      - name: position
        in: query
        required: false
        description: Filtrar por cargo (case-insensitive, busca parcial)
        schema:
          type: string
          example: RH
      - name: page
        in: query
        required: false
        description: Número da página (inicia em 0)
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        description: Quantidade de registros por página
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Lista paginada de contatos da empresa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactPaginated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /products:
    get:
      tags:
      - Produtos
      summary: Listar produtos disponíveis para comercialização
      description: "Retorna os produtos (benefícios/linhas de transporte) disponíveis para comercialização,\ncom seus limites\
        \ de valor e flags de obrigatoriedade.\n\nUse este endpoint para:\n- Obter os `codigoVenda` válidos antes de cadastrar\
        \ benefícios no usuário\n- Consultar limites de recarga (min/max) por produto\n- Verificar quais campos são obrigatórios\
        \ por produto (salário, RG, data nascimento, etc.)\n\nApenas produtos em linha (`emLinha = true`) são retornados.\n\
        \n## Filtro por endereço de entrega (recomendado para pedido PAPEL)\n\nPara pedido de vale papel, os produtos disponíveis\
        \ dependem da **região** \ndo endereço de entrega da empresa. Use o parâmetro `idEnderecoEntrega` para \nfiltrar automaticamente\
        \ pela região correta (internamente resolve \nendereço → região → produtos disponíveis na região).\n"
      operationId: listProducts
      parameters:
      - name: type
        in: query
        required: false
        description: 'Filtrar por tipo de produto:

          - `CARD`: produtos de cartão eletrônico (recarga)

          - `PAPER`: produtos de vale transporte em papel

          '
        schema:
          type: string
          enum:
          - CARD
          - PAPER
      - name: deliveryAddressId
        in: query
        required: false
        description: "Filtrar por região do endereço de entrega da empresa.\nO sistema resolve internamente: endereço → região\
          \ → produtos disponíveis.\n\n**Recomendado para pedido PAPER** — garante que os produtos retornados \nsão válidos\
          \ para o `deliveryAddressId` que será informado no `POST /orders`.\n\nObtido via `GET /companies/{companyId}/places`\
          \ (campo `id`).\n"
        schema:
          type: integer
          format: int64
          example: 1
      - name: saleCode
        in: query
        required: false
        description: "Filtrar por código de venda do produto (busca exata).\nCorresponde ao campo `codigoVenda` retornado no\
          \ response.\nPermite buscar um produto específico quando o código já é conhecido.\n"
        schema:
          type: string
          example: "009825"
      - name: search
        in: query
        required: false
        description: Filtrar por descrição do produto (case-insensitive, busca parcial)
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Número da página (inicia em 0)
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        description: Quantidade de registros por página
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Lista paginada de produtos disponíveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPaginated'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /companies/{companyId}/beneficiaries:
    get:
      tags:
      - Colaboradores
      summary: Listar colaboradores (beneficiários) da empresa
      description: 'Retorna os colaboradores (beneficiários) cadastrados na empresa.

        Suporta filtros por nome, CPF, matrícula, departamento, cargo, status e busca textual.

        Os resultados são paginados e ordenáveis.

        '
      operationId: listUsers
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      - name: beneficiaryDocumentNumber
        in: query
        required: false
        description: Filtrar por CPF exato (11 dígitos, apenas números)
        schema:
          type: string
          pattern: ^\d{11}$
          example: '12345678901'
      - name: registrationNumber
        in: query
        required: false
        description: Filtrar por matrícula exata
        schema:
          type: string
          example: '000012345'
      - name: name
        in: query
        required: false
        description: Filtrar por nome do colaborador (case-insensitive, busca parcial)
        schema:
          type: string
          example: João
      - name: department
        in: query
        required: false
        description: Filtrar por departamento (case-insensitive, busca parcial)
        schema:
          type: string
      - name: position
        in: query
        required: false
        description: Filtrar por cargo (case-insensitive, busca parcial)
        schema:
          type: string
      - name: workAddressId
        in: query
        required: false
        description: Filtrar por id do endereço de trabalho
        schema:
          type: integer
          minimum: 1
      - name: status
        in: query
        required: false
        description: Filtrar por status do colaborador
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
      - name: search
        in: query
        required: false
        description: 'Busca textual livre (case-insensitive, busca parcial) nos campos:

          nome, CPF, matrícula, departamento e cargo.

          '
        schema:
          type: string
          example: Silva
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
        description: Número da página (inicia em 0)
      - name: size
        in: query
        required: false
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
        description: Quantidade de registros por página
      - name: sort
        in: query
        required: false
        description: 'Campo de ordenação. Valores aceitos: `nome`, `cpf`, `matricula`, `departamento`, `cargo`.

          Sufixo `,asc` ou `,desc` para direção (default: `nome,asc`).

          '
        schema:
          type: string
          default: nome,asc
          example: nome,asc
      responses:
        '200':
          description: Lista paginada de colaboradores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryPaginated'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags:
      - Colaboradores
      summary: Cadastrar ou atualizar um colaborador (beneficiário)
      description: "Cadastra ou atualiza um único colaborador com seus dados pessoais, benefícios, endereço \nresidencial\
        \ e dados adicionais. Execução **síncrona**.\n\nAs validações aplicadas são documentadas abaixo.\n\n## Comportamento\
        \ (Upsert)\n\n- Se o CPF **não existe** na empresa → **cria** o colaborador (retorna 201)\n- Se o CPF **já existe**\
        \ com a mesma matrícula → **atualiza** os dados (retorna 200)\n- Se o CPF **já existe** com matrícula diferente →\
        \ **erro** USU-002 (retorna 409)\n\n## Endereço de Trabalho\n\nO endereço de trabalho deve ser cadastrado **previamente**\
        \ via \n`POST /empresas/{idEmpresa}/enderecos`. O campo `idEnderecoTrabalho` \nno objeto `usuario` deve referenciar\
        \ o `id` de um endereço já existente \nna empresa. Caso o endereço não exista, retorna erro USU-003.\n\n## Validações\
        \ Aplicadas\n\n### Pré-requisitos (bloqueantes)\n| Código | Validação | HTTP |\n|--------|-----------|------|\n| IMP-002\
        \ | Já existe um processamento ativo para esta empresa | 409 |\n\n### Validação de Dados do Colaborador\n| Código\
        \ | Validação | HTTP |\n|--------|-----------|------|\n| USU-001 | CPF inválido (dígito verificador incorreto) | 422\
        \ |\n| USU-002 | CPF já cadastrado com matrícula diferente na empresa | 409 |\n| USU-003 | Endereço de trabalho (id)\
        \ não existe na empresa | 422 |\n| USU-004 | CNPJ informado não cadastrado no sistema (cadastro em grupo) | 422 |\n\
        | USU-005 | CNPJ informado não pertence ao grupo econômico da empresa | 422 |\n| USU-006 | Data de nascimento inválida\
        \ (data futura) | 422 |\n| USU-007 | CEP do endereço residencial inexistente na base de CEPs | 422 |\n| USU-008 |\
        \ E-mail com formato inválido | 422 |\n| USU-009 | Campo RG não preenchido (quando produto exige) | 422 |\n| USU-010\
        \ | Campo Data de Nascimento não preenchido (quando produto exige) | 422 |\n| USU-011 | Colaborador sem nenhum benefício\
        \ informado | 422 |\n\n### Validação de Benefícios\n| Código | Validação | HTTP |\n|--------|-----------|------|\n\
        | BEN-001 | Produto (idProduto) não existe ou não está ativo para comercialização | 422 |\n| BEN-002 | Produto não\
        \ é entregue na região do endereço de trabalho da empresa | 422 |\n| BEN-003 | Produto facial sem valor unitário informado\
        \ | 422 |\n| BEN-004 | Produto não disponível para a empresa (sem contrato) | 422 |\n| BEN-005 | Quantidade de dias\
        \ trabalhados não informada | 422 |\n| BEN-006 | Quantidade de uso por dia não informada | 422 |\n\n### Validação\
        \ de Valores Min/Max\n| Código | Validação | HTTP |\n|--------|-----------|------|\n| VAL-001 | Valor total acima\
        \ do máximo do produto | 422 |\n| VAL-002 | Valor total abaixo do mínimo do produto | 422 |\n"
      operationId: createOrUpdateUser
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      - name: action
        in: query
        required: true
        schema:
          type: string
          enum:
          - INSERT
          - SEARCH
        description: 'Ação a ser executada:

          - `INSERT` — Cadastrar ou atualizar colaborador (upsert). Body: objeto completo do colaborador.

          - `SEARCH` — Consultar colaborador por CPF (dados sensíveis no body). Body: `{ "cpf": "12345678901" }`

          '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiaryWithAddressRequest'
      responses:
        '201':
          description: Colaborador **criado** com sucesso (CPF não existia na empresa)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryResponse'
        '200':
          description: Colaborador **atualizado** com sucesso (CPF já existia com mesma matrícula)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 'Conflito — possíveis causas:

            - CPF já cadastrado com matrícula diferente (USU-002)

            - Processamento ativo para a empresa (IMP-002)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: "Erro de validação — o corpo da resposta contém os detalhes dos erros \ncom os mesmos códigos de validação\
            \ documentados acima.\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /companies/{companyId}/beneficiaries/{beneficiaryId}:
    patch:
      tags:
      - Colaboradores
      summary: Atualização parcial do colaborador
      description: "Atualiza **parcialmente** os dados de um colaborador existente. Apenas os campos \nenviados no body serão\
        \ atualizados — campos omitidos permanecem inalterados.\n\nO `beneficiaryId` no path identifica qual colaborador será\
        \ atualizado.\n\nO método PATCH já indica atualização parcial — não é necessário query param `action`.\n\nDiferente\
        \ do `POST /beneficiaries?action=INSERT` (que faz upsert completo e exige todos os campos \nobrigatórios), o PATCH\
        \ permite alterar campos específicos sem reenviar toda a estrutura.\n\n**Exemplos de uso:**\n- Alterar apenas o endereço\
        \ residencial\n- Atualizar o salário\n- Trocar o endereço de trabalho (id)\n- Adicionar/remover benefícios\n\n## Regra\
        \ de benefícios no PATCH\n- Se `benefits` **não for enviado** → benefícios existentes permanecem inalterados\n- Se\
        \ `benefits` **for enviado** (mesmo vazio) → substitui completamente a lista existente\n\n## Validações Aplicadas\n\
        \nMesmos códigos de erro do `POST /beneficiaries?action=INSERT` (USU-001 a USU-011, BEN-001 a BEN-006, \nVAL-001 a\
        \ VAL-002), exceto:\n- **USU-002** não se aplica (o CPF já é do colaborador sendo atualizado)\n- Campos obrigatórios\
        \ do schema só são validados se enviados\n- **IMP-002** se aplica (bloqueio por processamento ativo)\n"
      operationId: patchUser
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      - name: beneficiaryId
        in: path
        required: true
        description: Identificador único do colaborador
        schema:
          type: integer
          format: int64
          example: 98765
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiaryPatchRequest'
      responses:
        '200':
          description: Colaborador atualizado parcialmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Processamento ativo para a empresa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Erro de validação — mesmos códigos do cadastro individual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /companies/{companyId}/orders:
    get:
      tags:
      - Pedidos
      summary: Listar pedidos da empresa
      description: "Retorna os pedidos já criados para a empresa (somente pedidos que passaram pelo \nprocessamento com sucesso).\
        \ Pedidos em processamento não aparecem nesta listagem — \nuse `GET /companies/{companyId}/processing/{idProcessamento}`\
        \ para acompanhar processamentos em andamento.\n\n## Comportamentos Esperados\n\n| Cenário | Comportamento |\n|---------|---------------|\n\
        | Empresa sem pedidos | Retorna 200 com lista vazia (`content: []`, `totalElements: 0`) |\n| Filtro por status | Retorna\
        \ apenas pedidos no status informado |\n| Filtro por período (dataInicio/dataFim) | Filtra pela data de criação do\
        \ pedido. Ambos opcionais e combináveis |\n| Apenas dataInicio informado | Retorna pedidos criados a partir desta\
        \ data (inclusive) |\n| Apenas dataFim informado | Retorna pedidos criados até esta data (inclusive) |\n| Paginação\
        \ | Resultados paginados (default: page=0, size=20). Campos `totalElements` e `totalPages` no response |\n| Ordenação\
        \ | Pedidos ordenados por data de criação decrescente (mais recente primeiro) |\n| Empresa não encontrada | Retorna\
        \ 404 |\n| clientId sem permissão para a empresa (CNPJ não pertence ao grupo) | Retorna 401 (bloqueado pelo Sensedia\
        \ via POST /authorize) |\n\n## Ciclo de Vida dos Pedidos (status)\n\n```\nFluxo normal (pré-pago):\nPENDENTE → CONFIRMADO\
        \ → PRODUCAO → EXPEDICAO → ENTREGUE → CONCLUIDO\n\nFluxo com entrega parcial:\nPENDENTE → CONFIRMADO → PRODUCAO →\
        \ EXPEDICAO → ENTREGUE_PARCIAL → ENTREGUE → CONCLUIDO\n\nFluxo pós-pago (com aprovação):\nPENDENTE → (aprovação) →\
        \ CONFIRMADO → PRODUCAO → EXPEDICAO → ENTREGUE → CONCLUIDO\n\nFluxo de rejeição (pós-pago):\nPENDENTE → REJEITADO\n\
        \nCancelamento:\nPENDENTE → CANCELADO (antes do pagamento do boleto)\nCONFIRMADO → CANCELADO (antes da liberação para\
        \ produção)\n\nNão permite cancelamento (retorna 409):\nPRODUCAO, EXPEDICAO, ENTREGUE_PARCIAL, ENTREGUE, CONCLUIDO,\
        \ REJEITADO, CANCELADO\n\nErro posterior:\nqualquer status → ERRO (inconsistência detectada)\n```\n\n## Filtros de\
        \ Status\n\n| Status | Descrição | Quando usar |\n|--------|-----------|-------------|\n| `PENDENTE` | Aguardando\
        \ aprovação ou liberação | Listar pedidos que precisam de ação |\n| `CONFIRMADO` | Aprovado, aguardando produção |\
        \ Acompanhar pedidos liberados |\n| `PRODUCAO` | Cartões em confecção | Acompanhar produção |\n| `EXPEDICAO` | Em\
        \ trânsito para entrega | Acompanhar entregas |\n| `ENTREGUE_PARCIAL` | Entrega parcial realizada | Acompanhar entregas\
        \ pendentes |\n| `ENTREGUE` | Entregue integralmente | Confirmar recebimento |\n| `CONCLUIDO` | Ciclo completo | Histórico\
        \ de pedidos finalizados |\n| `REJEITADO` | Reprovado na aprovação pós-pago | Investigar rejeições |\n| `CANCELADO`\
        \ | Cancelado pelo operador | Histórico de cancelamentos |\n| `ERRO` | Inconsistência detectada | Investigar problemas\
        \ |\n"
      operationId: listOrders
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      - name: status
        in: query
        required: false
        description: Filtrar por status do pedido
        schema:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - PRODUCTION
          - SHIPPING
          - PARTIALLY_DELIVERED
          - DELIVERED
          - COMPLETED
          - CANCELLED
          - ERROR
      - name: startDate
        in: query
        required: false
        description: Filtrar por data de criação do pedido (início do período, inclusive)
        schema:
          type: string
          format: date
          example: '2026-07-01'
      - name: endDate
        in: query
        required: false
        description: Filtrar por data de criação do pedido (fim do período, inclusive)
        schema:
          type: string
          format: date
          example: '2026-07-31'
      - name: page
        in: query
        required: false
        description: Número da página (inicia em 0)
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        description: Quantidade de registros por página
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: "Lista paginada de pedidos. Retorna lista vazia se não há pedidos \npara os filtros informados.\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPaginated'
        '404':
          description: Empresa não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags:
      - Pedidos
      summary: Submeter pedido de Vale Transporte
      description: "Submete um pedido de VT. O processamento é sempre **assíncrono**, independente da modalidade.\nRetorna\
        \ 202 + `idProcessamento` (UUID) para acompanhamento via polling.\n\n---\n\n## Fluxo por Modalidade\n\n### Modalidade\
        \ `INTEGRAL` ou `RECARGA_CERTA_COM_DESCONTO` (cartão eletrônico)\n\nProcessamento **assíncrono**. Retorna 202 + `idProcessamento`\
        \ para polling.\n\n```\n1. POST /orders (modalidade=INTEGRAL, abrangencia=COMPLETO)\n2. ← 202 { idProcessamento: \"\
        uuid\" }\n3. GET /companies/{companyId}/processing/{uuid} (polling)\n4. ← 200 { status: \"CONCLUIDO\", pedidoId: 123\
        \ }\n5. GET /orders/123\n```\n\n### Modalidade `PAPEL` (vale transporte em papel)\n\nProcessamento **assíncrono**.\
        \ Retorna 202 + `idProcessamento` para polling.\n\n```\nPasso 1: Consultar produtos disponíveis na região do endereço\
        \ de entrega\n────────────────────────────────────────────────────────────────────────\nGET /products?tipo=PAPEL&idEnderecoEntrega=1\n\
        ← 200 [\n    { idProduto: 9825, codigoVenda: \"009825\", descricao: \"METRO LINHA 1 AZUL\", tipo: \"PAPEL\", ... },\n\
        \    { idProduto: 4012, codigoVenda: \"004012\", descricao: \"ONIBUS URBANO SP\", tipo: \"PAPEL\", ... }\n  ]\n\n\
        Passo 2: Submeter pedido com os produtos selecionados\n────────────────────────────────────────────────────────────────────────\n\
        POST /companies/{companyId}/orders\n{\n  \"idEnderecoEntrega\": 1,\n  \"enderecoFaturamentoId\": 2,\n  \"contatoResponsavelId\"\
        : 3,\n  \"dataPagamento\": \"2026-08-01\",\n  \"periodoUtilizacao\": { \"dataInicio\": \"2026-08-01\", \"dataFim\"\
        : \"2026-08-31\" },\n  \"modalidade\": \"PAPEL\",\n  \"produtos\": [\n    { \"idProduto\": 9825, \"quantidade\": 44\
        \ },\n    { \"idProduto\": 4012, \"quantidade\": 22 }\n  ]\n}\n← 202 { idProcessamento: \"uuid\" }\n\nPasso 3: Acompanhar\
        \ processamento\n────────────────────────────────────────────────────────────────────────\nGET /companies/{companyId}/processing/{uuid}\n\
        ← 200 { status: \"CONCLUIDO\", pedidoId: 456 }\n```\n\n**Importante para pedido PAPEL:**\n- O campo `produtos` é **obrigatório**\
        \ (ao menos 1 item)\n- Cada `idProduto` deve existir na região do `idEnderecoEntrega` informado\n- Os campos `abrangencia`\
        \ e `cpfs` são **ignorados**\n- Não há validação de dados pessoais dos colaboradores\n- O valor é calculado como:\
        \ valor unitário do produto na região × quantidade\n\n---\n\n## Comportamentos Esperados\n\n| Cenário | Comportamento\
        \ | HTTP |\n|---------|---------------|------|\n| Pedido válido (qualquer modalidade) | Retorna `idProcessamento`\
        \ (UUID) para polling | 202 |\n| Request body inválido (JSON malformado, campos obrigatórios ausentes) | Erro síncrono\
        \ imediato | 400 |\n| Já existe processamento ativo para a empresa | Erro síncrono imediato | 409 |\n| Campos com\
        \ formato inválido (CPF, datas, emails) | Erro síncrono imediato | 422 |\n| `modalidade = INTEGRAL/RECARGA_CERTA`\
        \ sem campo `abrangencia` | Erro síncrono imediato | 422 |\n| `abrangencia = PARCIAL` sem campo `cpfs` | Erro síncrono\
        \ imediato | 422 |\n| `modalidade = PAPEL` sem campo `produtos` | Erro síncrono imediato | 422 |\n| `modalidade =\
        \ PAPEL` com `idProduto` inexistente na região | Erro síncrono imediato | 422 |\n| `modalidade = RECARGA_CERTA_COM_DESCONTO`\
        \ sem atributo na empresa | Erro síncrono imediato | 422 |\n| `idEnderecoEntrega` não existe na empresa | Erro síncrono\
        \ imediato | 422 |\n| Empresa não encontrada | Erro síncrono imediato | 404 |\n| clientId sem permissão para a empresa\
        \ (CNPJ não pertence ao grupo) | Erro bloqueado pelo Sensedia (POST /authorize) | 401 |\n\n## Comportamentos Assíncronos\n\
        \nAcompanhar via `GET /companies/{companyId}/processing/{idProcessamento}`:\n\n| Cenário | Resultado no StatusProcessamento\
        \ |\n|---------|--------------------------------|\n| Processamento concluído com sucesso (sem erros) | `status = CONCLUIDO`,\
        \ `pedidoId` preenchido, `totalColaboradoresComErro = 0` |\n| Processamento concluído com erros parciais | `status\
        \ = CONCLUIDO`, pedido criado **sem** os colaboradores com erro (inativados). Campo `totalColaboradoresComErro > 0`\
        \ e `errosValidacao` preenchido com detalhes |\n| Todos os colaboradores falharam na validação | `status = ERRO`,\
        \ `pedidoId = null`, pedido **não é criado**, campo `errosValidacao` preenchido |\n| Erro interno no cálculo (exceção)\
        \ | `status = ERRO`, `pedidoId = null`, campo `erro` com mensagem descritiva |\n| Timeout (> 5 min) | `status = ERRO`,\
        \ colaboradores inativados são reativados |\n\n## Erros Parciais e Relatório de Inconsistências\n\nQuando o processamento\
        \ conclui com erros parciais (alguns colaboradores com inconsistências, \nmas não todos), o sistema aplica o seguinte\
        \ comportamento:\n\n1. Colaboradores com erros de validação são **inativados** e **excluídos** do pedido\n2. O pedido\
        \ é **criado normalmente** com os colaboradores válidos\n3. O `StatusProcessamento` indica `totalColaboradoresComErro\
        \ > 0` e `errosValidacao` preenchido\n4. O campo `errosValidacao` contém os detalhes por colaborador (CPF, produto,\
        \ categoria, mensagem)\n\n**Para consultar as inconsistências:**\n```\nGET /companies/{idEmpresa}/processing/{idProcessamento}\n\
        → campo `errosValidacao` no response\n```\n\n**Para reativar colaboradores excluídos (após correção dos dados):**\n\
        ```\nPATCH /empresas/{idEmpresa}/usuarios/{cpf}\n{ \"status\": \"ATIVO\" }\n```\n\n## Efeitos Colaterais do Processamento\n\
        \n| Efeito | Quando | Detalhe |\n|--------|--------|---------|\n| Colaborador **inteiro inativado** (status → INATIVO)\
        \ | Erro de endereço residencial (empresa porta-a-porta) | Usuário é excluído de futuros pedidos até ser reativado\
        \ via PATCH |\n| **Benefício específico inativado** | Outros erros de validação (produto, cartão, dados pessoais)\
        \ | Apenas o benefício com erro é removido, demais benefícios do usuário permanecem |\n| Colaboradores inativados\
        \ são **reativados** | Quando processamento falha com ERRO (todos falharam) | Rollback automático |\n| Benefícios\
        \ inativos são **reativados** | Início do processamento (para recalcular toda a base) | Reset para nova tentativa\
        \ |\n| Pedido é persistido no banco | Apenas quando processamento conclui com sucesso (total ou parcial) | |\n| Relatório\
        \ de inconsistências gerado | Quando há erros parciais (pedido criado sem os colaboradores com erro) | |\n\n## Fluxo\
        \ Completo\n\n```\n1. Client → POST /pedidos (request body com dados do pedido)\n2. API valida request body (síncrono)\
        \ → se inválido: retorna 400/409/422\n3. API gera idProcessamento (UUID) → retorna 202 + PedidoAceito\n4. Background:\
        \ inicia validação + cálculo (19 etapas)\n5. Client → GET /companies/{companyId}/processing/{idProcessamento} (polling)\n\
        6a. Se sucesso: status=CONCLUIDO, pedidoId preenchido\n    → Client usa GET /pedidos/{pedidoId} para obter resultado\
        \ completo\n    → Se totalColaboradoresComErro > 0: campo errosValidacao com detalhes dos excluídos\n6b. Se erro:\
        \ status=ERRO, pedidoId=null, errosValidacao preenchido\n```\n\n## Abrangência\n\n- `COMPLETO`: gera pedido para toda\
        \ a base de colaboradores ativos\n- `PARCIAL`: gera pedido apenas para os CPFs informados na lista\n\n## Modalidade\n\
        \n- `INTEGRAL`: pedido integral (crédito eletrônico completo)\n- `RECARGA_CERTA_COM_DESCONTO`: recarga certa com desconto\
        \ aplicado\n- `PAPEL`: vale transporte em papel\n\n## Grupo Econômico\n\nPara empresas que fazem parte de um grupo\
        \ econômico, o `idEmpresa` no path \npode ser uma empresa filha do grupo. A autenticação (clientId no API Gateway)\
        \ identifica a empresa \nlogada (matriz), e a validação verifica se a empresa alvo pertence ao grupo.\n\n- Se `idEmpresa`\
        \ é a própria empresa logada → pedido normal\n- Se `idEmpresa` é uma filial do grupo → valida que não há pedido ativo\
        \ para a filial\n- Se `idEmpresa` não pertence ao grupo → retorna 401 (bloqueado pelo Sensedia via POST /authorize)\n\
        \n## Validações Realizadas (durante o processamento assíncrono)\n\n### 1. Pré-requisitos da Empresa (bloqueantes)\n\
        - Empresa deve possuir endereço cadastrado\n- Não pode haver outro processamento ativo para a empresa\n- Empresa deve\
        \ possuir ao menos um colaborador com benefício ativo\n- Não pode haver importação de arquivo em andamento para a\
        \ empresa\n\n### 2. Validações de Produto (por usuário/benefício)\n- **Salário obrigatório**: se o produto exige salário,\
        \ o valor deve estar preenchido e > 0\n- **Produto disponível**: produto deve estar em linha para comercialização\n\
        \n### 3. Validações de Cartões Eletrônicos\n- **Valor mínimo primeira recarga**: subtotal deve atingir o valor mínimo\
        \ para 1ª recarga\n- **Valor mínimo recarga**: subtotal deve ser >= valor mínimo configurado\n- **Valor máximo recarga**:\
        \ subtotal deve ser <= valor máximo configurado\n- **Colaborador sem cartão**: colaborador deve possuir cartão ativo\
        \ quando exigido\n\n### 4. Validações de Dados Pessoais (conforme configuração do produto)\n- **Valor FETRANSPOR facial** (produto\
        \ 283): entre R$ 2,50 e R$ 20,00\n- **Facial FETRANSPOR** (produto 398): > R$ 0,70\n- **CPF**: válido quando obrigatório\n\
        - **RG**: mínimo 5 caracteres + estado de emissão quando obrigatório\n- **Data de nascimento**: preenchida quando\
        \ obrigatório\n- **Nome da mãe**: mínimo 8 caracteres quando obrigatório\n- **Endereço residencial**: obrigatório\
        \ para empresas porta-a-porta ou quando exigido pelo produto\n\n### 5. Validações de Produto Devolução\n- Empresa\
        \ deve possuir atributo \"DEVOLUÇÃO USUÁRIO\"\n- Quantidade de devoluções não pode exceder o máximo configurado\n\
        - Dados bancários obrigatórios quando configurado\n- Valor total não pode exceder o máximo permitido para devolução\n"
      operationId: createOrder
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '202':
          description: "**Pedido aceito para processamento assíncrono.**\nRetornado para todas as modalidades (`INTEGRAL`,\
            \ `RECARGA_CERTA_COM_DESCONTO` e `PAPEL`).\nUse o `idProcessamento` para acompanhar o progresso via \n`GET /companies/{companyId}/processing/{processingId}`.\n"
          headers:
            Location:
              description: URL para acompanhar o processamento
              schema:
                type: string
                example: /vt/v1/companies/{companyId}/processing/{processingId}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 'Conflito — possíveis causas:

            - Já existe processamento ativo para esta empresa

            - Existe importação de arquivo em andamento para a empresa

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Erro de validação — possíveis causas:

            - `modalidade = INTEGRAL/RECARGA_CERTA` sem campo `abrangencia`

            - `abrangencia = PARCIAL` sem campo `cpfs`

            - `modalidade = PAPEL` sem campo `produtos`

            - `modalidade = RECARGA_CERTA_COM_DESCONTO` sem atributo na empresa

            - `idEnderecoEntrega` não existe na empresa

            - Empresa não possui colaboradores ativos com benefícios (INTEGRAL/RECARGA_CERTA)

            - Produto informado não disponível na região do endereço de entrega (PAPEL)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /companies/{companyId}/orders/{orderId}:
    get:
      tags:
      - Pedidos
      summary: Consultar pedido por ID
      operationId: getOrder
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Dados do pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /companies/{companyId}/orders/{orderId}/cancel:
    post:
      tags:
      - Pedidos
      summary: Cancelar pedido
      description: "Cancela um pedido já criado, desde que as regras de negócio permitam.\n\n## Regras de Cancelamento\n\n\
        Baseado nas regras contratuais e de negócio do sistema legado:\n\n> \"Pedidos somente poderão ser cancelados **antes\
        \ do pagamento do boleto** \n> ou **liberação do pedido para produção**.\"\n\n### Condições para cancelamento (TODAS\
        \ devem ser atendidas)\n\n| # | Condição | Descrição |\n|---|----------|-----------|\n| 1 | Fase permite | Fase deve\
        \ ser `PENDENTE` ou `CONFIRMADO` |\n| 2 | Não está em produção | Fase **NÃO** pode ser `PRODUCAO`, `EXPEDICAO`, `ENTREGUE_PARCIAL`\
        \ ou `ENTREGUE` |\n| 3 | Não está cancelado/rejeitado | Status **NÃO** pode ser `CANCELADO` ou `REJEITADO` |\n| 4\
        \ | Pagamento não efetivado (pré-pago) | Para empresas pré-pago: boleto não pode ter sido pago |\n| 5 | Não liberado\
        \ para produção (pós-pago) | Para empresas pós-pago: pedido não pode ter sido liberado |\n\n### Etapas do cancelamento\n\
        \n1. **Verificação** — Valida se o pedido pode ser cancelado (regras acima)\n2. **Liberação** — Libera o pedido para\
        \ cancelamento (reverte reservas/bloqueios)\n3. **Cancelamento** — Altera o status para `CANCELADO` e persiste\n\n\
        ## Comportamentos Esperados\n\n| Cenário | Comportamento | HTTP |\n|---------|---------------|------|\n| Pedido `PENDENTE`,\
        \ pagamento não efetivado | Pedido cancelado com sucesso | 200 |\n| Pedido `CONFIRMADO`, ainda não liberado para produção\
        \ | Pedido cancelado com sucesso | 200 |\n| Pedido `PENDENTE` mas pagamento já efetivado (pré-pago) | Não pode ser\
        \ cancelado | 409 |\n| Pedido `CONFIRMADO` mas já liberado para produção (pós-pago) | Não pode ser cancelado | 409\
        \ |\n| Pedido em fase `PRODUCAO` | Não pode ser cancelado (já em produção) | 409 |\n| Pedido em fase `EXPEDICAO` |\
        \ Não pode ser cancelado (já expedido) | 409 |\n| Pedido em fase `ENTREGUE_PARCIAL` | Não pode ser cancelado (entrega\
        \ parcial já realizada) | 409 |\n| Pedido em fase `ENTREGUE` | Não pode ser cancelado (já entregue) | 409 |\n| Pedido\
        \ com status `REJEITADO` | Não pode ser cancelado (já rejeitado) | 409 |\n| Pedido com status `CANCELADO` | Não pode\
        \ ser cancelado (já cancelado) | 409 |\n| Pedido não encontrado | Retorna 404 | 404 |\n\n\n## Efeitos do Cancelamento\n\
        \n| Efeito | Descrição |\n|--------|-----------|\n| Status atualizado | Pedido passa para status `CANCELADO` |\n|\
        \ Créditos revertidos | Créditos reservados/bloqueados são liberados |\n| Título cancelado | Título financeiro (boleto/fatura)\
        \ é cancelado |\n| Log de segurança | Registra data/hora do cancelamento e operador responsável |\n\n## Motivos de\
        \ Rejeição do Cancelamento (campo `message` no response 409)\n\n| Motivo | Descrição |\n|--------|-----------|\n|\
        \ `FASE_NAO_PERMITE` | Pedido já está em produção, expedição ou entregue |\n| `STATUS_NAO_PERMITE` | Pedido já está\
        \ cancelado ou rejeitado |\n| `PAGAMENTO_EFETIVADO` | Pagamento do boleto já foi compensado (pré-pago) |\n| `LIBERADO_PRODUCAO`\
        \ | Pedido já foi liberado para produção (pós-pago) |\n"
      operationId: cancelOrder
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      - name: orderId
        in: path
        required: true
        description: ID do pedido a ser cancelado
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Pedido cancelado com sucesso (sem conteúdo no response)
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: "Pedido não pode ser cancelado. O campo `message` contém o motivo \n(FASE_NAO_PERMITE, STATUS_NAO_PERMITE,\
            \ PAGAMENTO_EFETIVADO ou LIBERADO_PRODUCAO).\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /companies/{companyId}/processing/{processingId}:
    get:
      tags:
      - Pedidos
      summary: Acompanhar processamento do pedido
      description: "Endpoint leve para polling do status de processamento.\n\nUse o `idProcessamento` (UUID) retornado pelo\
        \ `POST /empresas/{idEmpresa}/pedidos` \npara acompanhar o progresso. Este UUID é um identificador de rastreamento\
        \ — \n**não é o id do pedido**, pois o pedido só será criado ao final do processamento.\n\nQuando o status mudar para\
        \ `CONCLUIDO`, o campo `pedidoId` será preenchido \ncom o id real do pedido criado. Use esse id para consultar o pedido\
        \ completo \nvia `GET /empresas/{idEmpresa}/pedidos/{pedidoId}`.\n\nQuando o status mudar para `ERRO`, o pedido não\
        \ foi criado e o campo `erro` \nconterá a descrição do problema.\n"
      operationId: getOrderProcessingStatus
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      - name: processingId
        in: path
        required: true
        description: UUID de rastreamento retornado pelo POST /pedidos
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Status atual do processamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /companies/{companyId}/orders/{orderId}/approve:
    post:
      tags:
      - Pedidos
      summary: Aprovar pedido pós-pago (liberar para produção)
      description: "Aprova um pedido pós-pago pendente, liberando-o para produção.\n\nO pedido deve estar no status `PENDENTE`\
        \ (fase \"A CONFIRMAR\") para ser aprovado.\nApós a aprovação, o pedido avança para o status `CONFIRMADO` e segue\
        \ para produção.\n\n## Validações realizadas na aprovação\n\n| Validação | Motivo de rejeição |\n|-----------|-------------------|\n\
        | Empresa não possui pagamentos em atraso | `INADIMPLENTE` — Há pedidos com pagamento em atraso |\n| Título possui\
        \ contrato definido | `SEM_CONTRATO` — Título pós-pago não tem contrato definido |\n| Contrato está ativo | `CONTRATO_INATIVO`\
        \ — Contrato inativo |\n| Contrato não está vencido | `CONTRATO_VENCIDO` — Contrato vencido |\n| Contrato sem restrição\
        \ CRM | `CONTRATO_RESTRICAO` — Restrição no contrato |\n| Contrato possui saldo disponível | `CONTRATO_SEM_SALDO`\
        \ — Não existe saldo disponível |\n| Pedido sem restrição para liberação | `PEDIDO_RESTRICAO` — Pedido com situação\
        \ não permitida |\n| Pedido sem Recarga Certa em andamento | `PEDIDO_RC_RESTRICAO` — Recarga Certa em andamento |\n\
        \n## Fluxo após aprovação\n\n```\nPENDENTE → CONFIRMADO → PRODUÇÃO → EXPEDIÇÃO → ENTREGUE\n```\n\nSe alguma validação\
        \ falhar, o pedido **não é aprovado** e o motivo é retornado \nno response (HTTP 422).\n"
      operationId: approveOrder
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Pedido aprovado e liberado para produção (sem conteúdo no response)
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Pedido não está pendente de aprovação (já aprovado, cancelado ou em outro status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Pedido não pode ser aprovado — validações do contrato/empresa falharam.

            O campo `message` contém o motivo da rejeição.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /companies/{companyId}/orders-validate:
    post:
      tags:
      - Validações
      summary: Pré-validar dados dos colaboradores para pedido (síncrono)
      description: 'Executa apenas as validações dos dados dos beneficiários de forma **síncrona**,

        sem iniciar o cálculo de taxas. Útil para validar dados antes de submeter o pedido.


        Retorna a lista de erros encontrados por usuário/produto.

        **Não** inativa usuários, **não** cria pedido, **não** calcula valores.


        Validações executadas:

        - Empresa possui endereço cadastrado

        - Não há outro processamento ativo para a empresa

        - Validação de produtos (salário, disponibilidade)

        - Validação de cartões eletrônicos (limites de recarga, cartão ativo)

        - Validação de dados pessoais (CPF, RG, data nascimento, nome mãe)

        - Validação de endereço residencial

        - Validação de produto devolução

        '
      operationId: preValidateOrder
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - scope
              properties:
                scope:
                  type: string
                  enum:
                  - COMPLETE
                  - PARTIAL
                  description: 'Abrangência da validação:

                    - `COMPLETE`: valida toda a base de colaboradores ativos

                    - `PARTIAL`: valida apenas os CPFs informados (campo `beneficiaryDocumentNumbers` obrigatório)

                    '
                beneficiaryDocumentNumbers:
                  type: array
                  description: Lista de CPFs para validação (obrigatório quando scope = PARTIAL)
                  items:
                    type: string
                    pattern: ^\d{11}$
      responses:
        '200':
          description: Resultado da validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Já existe processamento ativo para esta empresa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /companies/{companyId}/rules-validate:
    get:
      tags:
      - Validações
      summary: Consultar regras de validação aplicáveis à empresa
      description: 'Retorna as regras de validação que serão aplicadas para os produtos e benefícios

        da empresa, permitindo que o consumer faça pré-validação local antes de submeter.

        '
      operationId: getValidationRules
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      - name: page
        in: query
        required: false
        description: Número da página (inicia em 0)
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        description: Quantidade de registros por página
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Regras de validação aplicáveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRules'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /companies/{companyId}/orders/{orderId}/payment-slip:
    get:
      tags:
      - Pedidos
      summary: Obter URL de download do boleto do pedido
      description: "Retorna uma URL pré-assinada (S3) para download do boleto bancário do pedido em formato PDF.\n\nA URL\
        \ tem validade de **60 minutos**. Caso expire, chame este endpoint novamente \npara obter uma nova URL.\n\nO boleto\
        \ é gerado para pedidos pré-pagos com status `PENDENTE` ou `CONFIRMADO`.\nPara pedidos pós-pagos, o boleto/fatura\
        \ é gerado após a aprovação.\n\n## Pré-condições\n- Pedido deve existir e pertencer à empresa\n- Pedido deve possuir\
        \ título financeiro gerado (boleto ou fatura)\n\n## Comportamentos\n\n| Cenário | HTTP |\n|---------|------|\n| Boleto\
        \ disponível | 200 (URL pré-assinada) |\n| Pedido não encontrado | 404 |\n| Pedido sem boleto gerado (ex: cancelado\
        \ antes da geração) | 404 |\n"
      operationId: getPaymentSlipUrl
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      - name: orderId
        in: path
        required: true
        description: ID do pedido
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: URL pré-assinada para download do boleto (válida por 60 minutos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDownload'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /companies/{companyId}/orders/{orderId}/invoice:
    get:
      tags:
      - Pedidos
      summary: Obter URL de download da nota fiscal do pedido
      description: "Retorna uma URL pré-assinada (S3) para download da nota fiscal (NFe) do pedido em formato PDF.\n\nA URL\
        \ tem validade de **60 minutos**. Caso expire, chame este endpoint novamente \npara obter uma nova URL.\n\nA nota\
        \ fiscal é gerada após a confirmação do pagamento e produção do pedido.\nDisponível para pedidos com status `PRODUCAO`,\
        \ `EXPEDICAO`, `ENTREGUE` ou `CONCLUIDO`.\n\n## Pré-condições\n- Pedido deve existir e pertencer à empresa\n- Pedido\
        \ deve ter nota fiscal emitida (status avançado no fluxo)\n\n## Comportamentos\n\n| Cenário | HTTP |\n|---------|------|\n\
        | Nota fiscal disponível | 200 (URL pré-assinada) |\n| Pedido não encontrado | 404 |\n| Nota fiscal ainda não emitida\
        \ (pedido em fase anterior) | 404 |\n"
      operationId: getInvoiceUrl
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      - name: orderId
        in: path
        required: true
        description: ID do pedido
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: URL pré-assinada para download da nota fiscal (válida por 60 minutos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDownload'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /companies/{companyId}/reports:
    post:
      tags:
      - Relatórios
      summary: Solicitar geração de relatório (assíncrono)
      description: "Solicita a geração assíncrona de um relatório.\n\nO tipo do relatório e o pedido associado são informados\
        \ via query parameters.\n\nPara `type=consolidated`, o relatório consolida todas as informações do pedido: \nresumo\
        \ financeiro, detalhamento por colaborador, benefícios, taxas de serviço e \ninconsistências (quando houver). O formato\
        \ gerado é XLS (planilha Excel com múltiplas abas).\n\nO processamento é feito em background. O response retorna um\
        \ `idRelatorio` (UUID) \nque deve ser usado para acompanhar o status via \n`GET /companies/{companyId}/reports/{reportId}`.\n\
        \nQuando a geração for concluída, o endpoint de consulta retornará uma URL \npré-assinada (S3) para download do arquivo.\n\
        \n## Fluxo assíncrono\n\n```\nPOST /companies/{companyId}/reports?orderId=123&type=consolidated → 202 (idRelatorio)\n\
        \     ↓\nGET /companies/{companyId}/reports/{idRelatorio} (polling)\n     ↓\n200 (status: PROCESSANDO | CONCLUIDO\
        \ | ERRO)\n     ↓\nQuando CONCLUIDO → campo `urlDownload` com URL pré-assinada S3\n```\n"
      operationId: requestReport
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      - name: orderId
        in: query
        required: true
        description: ID do pedido associado ao relatório
        schema:
          type: integer
          format: int64
      - name: type
        in: query
        required: true
        description: 'Tipo do relatório a ser gerado:

          - `consolidated`: relatório consolidado do pedido (XLS com múltiplas abas)

          '
        schema:
          type: string
          enum:
          - consolidated
      responses:
        '202':
          description: Solicitação de geração aceita. Use o `idRelatorio` para acompanhar o status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Já existe uma geração de relatório em andamento para este pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /companies/{companyId}/reports/{reportId}:
    get:
      tags:
      - Relatórios
      summary: Consultar status e download de relatório
      description: "Consulta o status da geração de qualquer relatório solicitado de forma assíncrona.\n\nEste endpoint é\
        \ genérico e serve para acompanhar relatórios de qualquer contexto \n(pedidos, usuários, etc.). O campo `tipo` no\
        \ response identifica o tipo do relatório.\n\nUse o `idRelatorio` (UUID) retornado pelo endpoint de solicitação \n\
        (ex: `POST /empresas/{idEmpresa}/pedidos/{pedidoId}/relatorios/consolidado`) \npara acompanhar o progresso via polling.\n\
        \n## Status possíveis\n\n| Status | Descrição |\n|--------|-----------|\n| `PROCESSANDO` | Relatório ainda está sendo\
        \ gerado |\n| `CONCLUIDO` | Relatório pronto — campo `urlDownload` contém a URL pré-assinada |\n| `ERRO` | Falha na\
        \ geração — campo `erro` contém a descrição do problema |\n\nA URL pré-assinada (S3) tem validade de **60 minutos**\
        \ após a geração. \nCaso expire, solicite uma nova geração.\n"
      operationId: getReportStatus
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      - name: reportId
        in: path
        required: true
        description: UUID do relatório retornado pela solicitação
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Status atual da geração do relatório
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    CompanyIdPath:
      name: companyId
      in: path
      required: true
      description: Identificador único da empresa
      schema:
        type: integer
        format: int64
        example: 12345
    CompanyDocumentRootHeader:
      name: X-Company-Document-Root
      in: header
      required: true
      description: 'Raiz do CNPJ (8 primeiros dígitos) vinculada ao clientId no Sensedia.

        Injetado automaticamente pelo API Gateway — **não enviar manualmente**.

        Backend usa este valor para validar se o `companyId` no path pertence ao grupo econômico.

        '
      schema:
        type: string
        pattern: ^\d{8}$
        example: '12345678'
    BeneficiaryDocumentNumberPath:
      name: beneficiaryDocumentNumber
      in: path
      required: true
      description: CPF do colaborador (apenas números, 11 dígitos)
      schema:
        type: string
        pattern: ^\d{11}$
        example: '12345678901'
  schemas:
    Address:
      type: object
      description: Endereço cadastrado na empresa (cobrança, entrega ou faturamento/entrega)
      properties:
        id:
          type: integer
          format: int64
          description: Identificador único do endereço dentro da empresa
          example: 1
        companyId:
          type: integer
          format: int64
          example: 12345
        type:
          type: string
          enum:
          - BILLING
          - DELIVERY
          - BILLING_AND_DELIVERY
          description: 'Tipo do endereço:

            - `BILLING` — Cobrança (boletos, faturas)

