      description: Benefício (linha de transporte) vinculado ao colaborador
      properties:
        productId:
          type: integer
          format: int64
          description: Identificador interno do produto
          example: 9825
        saleCode:
          type: string
          description: Código de venda do produto (identificador visível)
          example: 009825
        description:
          type: string
          maxLength: 50
          description: Descrição do benefício (nome da linha de transporte)
          example: METRO LINHA 1 AZUL
        unitPrice:
          type: number
          format: double
          description: Valor unitário do item em reais
          example: 4.4
        quantity:
          type: integer
          minimum: 1
          description: Quantidade
          example: 2
