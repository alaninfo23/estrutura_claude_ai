          type: string
          maxLength: 25
          description: Número do cartão do beneficiário (quando aplicável)
    BenefitRequest:
      type: object
      required:
      - saleCode
      - unitPrice
      - usagePerDay
      description: 'Benefício (linha de transporte) a vincular ao colaborador.


        ## Cálculo do Subtotal


        O subtotal do benefício é calculado automaticamente pelo sistema como:

        ```

        subtotal = unitPrice × usagePerDay × workingDaysPerMonth (do usuário)

        ```


        Este valor é usado para validar:

        - Limites min/max de recarga do produto (cartões eletrônicos)

        - Valor mínimo de primeira recarga

        - Limites de valor unitário (ex: R$ 0,70 para FETRANSPOR facial)


        ## Validações por Produto


        | Produto | Regra |

        |---------|-------|


        | Produto 398 (FETRANSPOR facial) | unitPrice > R$ 0,70 |

        | Cartão eletrônico | subtotal >= minRechargeValue e <= maxRechargeValue |

        | Primeira recarga | subtotal >= minFirstRechargeValue (quando sem cartão) |

        '
      properties:
        saleCode:
          type: string
          pattern: ^\d{6}$
          description: "Código de venda do produto/benefício (6 dígitos com zeros à esquerda).\nÉ o identificador visível\
            \ do produto conforme cadastro da Alelo (ex: \"009825\" para FETRANSPOR).\nPode ser consultado via `GET /empresas/{idEmpresa}/produtos`\
            \ ou \n`GET /empresas/{idEmpresa}/pedidos/validar/regras`.\n"
          example: 009825
        unitPrice:
          type: number
          format: double
          minimum: 0.01
          description: 'Valor unitário da passagem/benefício em reais.

            Para produtos faciais, é o valor da tarifa definido pelo operador.

            Para produtos não-faciais, o valor é definido pelo produto.


            Limites por produto (validados durante o processamento):

            
            - Produto 398 (FETRANSPOR facial): > R$ 0,70

            '
          example: 4.4
        usagePerDay:
          type: integer
          minimum: 1
          description: 'Quantidade de uso do benefício por dia.

            Utilizado no cálculo do subtotal: `unitPrice × usagePerDay × workingDaysPerMonth`.

            '
          example: 2
