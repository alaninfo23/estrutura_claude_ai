      '/companies/{companyId}/routing-requests/{batchId}':
        {
          'get':
            {
              'tags': ['Routing (V2)'],
              'summary': 'Consultar status do lote de roteirização (V2)',
              'description': "Fluxo V2: Retorna o progresso do processamento assíncrono de um lote de roteirização,\ncom detalhamento por beneficiário.\n\nO `batchId` é obtido no response do `POST /routing-requests`.\n\n## Status do lote (`status`)\n| Status | Descrição |\n|--------|-----------|\n| `PROCESSING` | Pelo menos 1 beneficiário ainda em processamento |\n| `COMPLETED` | Todos finalizados sem erros |\n| `COMPLETED_WITH_ERRORS` | Finalizado com mistura de sucesso e erro |\n| `ERROR` | Todos os beneficiários com erro |\n\n## Status por beneficiário (`content[].status`)\n| Status | Descrição |\n|--------|-----------|\n| `PROCESSING` | Processando rota |\n| `ERROR` | Erro técnico ou de negócio |\n| `AWAITING_APPROVAL` | Aguardando aprovação (rota calculada) |\n| `CONTESTATION_OPEN` | Contestação aberta |\n| `CONTESTATION_ANSWERED` | Contestação respondida |\n| `APPROVED` | Aprovado pelo colaborador |\n| `REJECTED` | Reprovado pelo colaborador |\n| `COMPLETED` | Finalizado |\n",
              'operationId': 'getBatchStatus',
              'parameters':
                [
                  {
                    'name': 'companyId',
                    'in': 'path',
                    'description': 'ID da empresa',
                    'required': true,
                    'schema':
                      {
                        'type': 'integer',
                        'format': 'int64',
                        'example': 835181,
                        'exclusiveMinimum': 0,
                      },
                  },
                  {
                    'name': 'batchId',
                    'in': 'path',
                    'description': 'ID do lote da roteirização (retornado pelo endpoint POST /routing-requests que faz a solicitação da roteirização na SAT)',
                    'required': true,
                    'schema':
                      {
                        'type': 'integer',
                        'format': 'int64',
                        'example': 101,
                        'exclusiveMinimum': 0,
                      },
                  },
                  {
                    'name': 'page',
                    'in': 'query',
                    'description': 'Número da página (começa em 0)',
                    'schema': { 'type': 'integer', 'default': 0 },
                  },
                  {
                    'name': 'size',
                    'in': 'query',
                    'description': 'Quantidade de registros por página',
                    'schema': { 'type': 'integer', 'default': 10 },
                  },
                  {
                    'name': 'sort',
                    'in': 'query',
                    'description': "Campo e direção de ordenação no formato `campo,direção`.\n\n**Campos suportados:**\n| Campo | Descrição |\n|-------|-----------|\n| `updatedAt` | Data da última atualização (padrão) |\n| `routeId` | ID da roteirização |\n| `beneficiaryId` | ID do beneficiário |\n| `status` | Status do beneficiário (`COMPLETED` → `ERROR` → `PROCESSING`) |\n\n**Exemplos:** `updatedAt,desc` · `status,asc` · `beneficiaryId,asc`\n",
                    'schema':
                      {
                        'type': 'string',
                        'default': 'updatedAt,desc',
                        'enum':
                          [
                            'updatedAt,asc',
                            'updatedAt,desc',
                            'routeId,asc',
                            'routeId,desc',
                            'beneficiaryId,asc',
                            'beneficiaryId,desc',
                            'status,asc',
                            'status,desc',
                          ],
                      },
                  },
                ],
              'responses':
                {
                  '200':
                    {
                      'description': 'Status do lote retornado com sucesso',
                      'content':
                        {
                          '*/*':
                            {
                              'schema':
                                {
                                  '$ref': '#/components/schemas/BatchStatusResponse',
                                },
                            },
                        },
                    },
                  '400':
                    {
                      'description': 'Parâmetros inválidos (Ex: companyId ou batchId negativos ou zero)',
