      '/companies/{companyId}/beneficiaries':
        {
          'get':
            {
              'tags': ['Routing (V2)'],
              'summary': 'Listar usuários pendentes de roteirização',
              'description': "Retorna colaboradores ativos que precisam de roteirização.\n\nDiferente do legado (que só retornava quem tinha endereço válido), este endpoint retorna **todos** os colaboradores ativos com o campo `eligible` indicando se estão aptos para roteirização e `ineligibilityReason` explicando o motivo quando não estão.\n\nUse este endpoint para:\n- Identificar quais colaboradores precisam de roteirização\n- Ver quem precisa de correção de dados antes de roteirizar\n- Selecionar colaboradores para o POST /routing-requests\n\n## Campo `eligible`\n- `true` — colaborador apto para roteirização (endereço residencial + trabalho válidos, sem rota ativa)\n- `false` — colaborador **não** apto (campo `ineligibilityReason` indica o motivo)\n\n## Motivos de inelegibilidade (`ineligibilityReason`)\n| Motivo | Descrição |\n|--------|-----------|\n| `MISSING_HOME_ADDRESS` | Endereço residencial não cadastrado |\n| `MISSING_WORK_ADDRESS` | Endereço de trabalho não cadastrado |\n| `ROUTE_IN_PROGRESS` | Já possui roteirização em processamento |\n| `ROUTE_ACTIVE` | Já possui rota ativa (finalizada/aprovada) |\n\n## Filtros disponíveis\n- Busca por nome, CPF, departamento, endereço de trabalho\n- Filtro por elegibilidade\n- Filtro por status da última roteirização\n- Paginação e ordenação\n",
              'operationId': 'listBeneficiaries',
              'parameters':
                [
                  {
                    'name': 'companyId',
                    'in': 'path',
                    'description': 'ID da empresa para a qual listar os beneficiários',
                    'required': true,
                    'schema':
                      {
                        'type': 'integer',
                        'format': 'int64',
                        'example': 834552,
                        'exclusiveMinimum': 0,
                      },
                  },
                  {
                    'name': 'beneficiaryDocumentNumber',
                    'in': 'query',
                    'description': 'CPF do beneficiário para filtrar (11 dígitos numéricos, sem máscara)',
                    'required': false,
                    'schema':
                      {
                        'type': 'string',
                        'example': '09304730783',
                        'pattern': '^[0-9]{11}$',
                      },
                  },
                  {
                    'name': 'name',
                    'in': 'query',
